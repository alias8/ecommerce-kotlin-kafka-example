spring.application.name=order-service
# Server
server.port=8080
# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
# PostgreSQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommercedb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecommerce}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecommerce}
# MongoDB database
spring.data.mongodb.uri=mongodb://localhost:27017/productdb
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
logging.level.org.springframework.cache=TRACE
# Auth
cookie.secure=${COOKIE_SECURE:false}
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-in-production}
jwt.expiration-ms=2592000000
# Worker: true = this process also consumes queues (see report/ReportWorker.kt).
# Production would run the same JAR twice: web with false, worker with true + spring.main.web-application-type=none
app.worker.enabled=${APP_WORKER_ENABLED:true}
# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10s
# JPA - schema is owned by Flyway migrations (db/migration); Hibernate only validates it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# logging
logging.level.org.springframework.kafka=DEBUG