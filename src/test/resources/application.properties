# Test-only overrides: keep @SpringBootTest hermetic and fast with an in-memory
# H2 database instead of requiring a real Postgres instance. Hibernate creates the
# schema directly here (no Flyway) since it's thrown away after each test run.
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
